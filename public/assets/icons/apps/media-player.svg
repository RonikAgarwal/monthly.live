<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="playerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#333333"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0a1a2c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(100,200,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(100,200,255,0)"/>
    </linearGradient>
    <filter id="playerShadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main body -->
  <rect x="30" y="50" width="196" height="160" rx="8" fill="url(#playerGrad)" filter="url(#playerShadow)"/>
  
  <!-- Screen area -->
  <rect x="45" y="65" width="166" height="95" rx="4" fill="url(#screenGrad)" stroke="#555" stroke-width="2"/>
  
  <!-- Play button glow -->
  <circle cx="128" cy="112" r="25" fill="rgba(100,200,255,0.15)" filter="url(#glowFilter)"/>
  
  <!-- Play triangle -->
  <polygon points="118,95 118,130 148,112" fill="#64c8ff" opacity="0.9"/>
  
  <!-- Screen reflection -->
  <path d="M45,65 L45,95 L120,65 Z" fill="white" opacity="0.05"/>
  
  <!-- Bottom controls bar -->
  <rect x="45" y="170" width="166" height="25" rx="3" fill="#2a2a2a"/>
  
  <!-- Volume icon -->
  <polygon points="165,178 170,175 175,172 175,192 170,189 165,186" fill="#888"/>
  <path d="M180,177 Q188,182 180,190" fill="none" stroke="#888" stroke-width="1.5"/>
  
  <!-- Progress bar -->
  <rect x="55" y="180" width="100" height="4" rx="2" fill="#555"/>
  <rect x="55" y="180" width="40" height="4" rx="2" fill="#64c8ff"/>
  
  <!-- Transport buttons -->
  <rect x="60" y="218" width="30" height="20" rx="3" fill="#3a3a3a" stroke="#555" stroke-width="1"/>
  <polygon points="68,225 68,233 75,229" fill="#ccc"/>
  
  <rect x="95" y="218" width="30" height="20" rx="3" fill="#4a4a4a" stroke="#64c8ff" stroke-width="1.5"/>
  <polygon points="105,224 105,234 117,229" fill="#64c8ff"/>
  
  <rect x="130" y="218" width="30" height="20" rx="3" fill="#3a3a3a" stroke="#555" stroke-width="1"/>
  <rect x="138" y="224" width="3" height="8" fill="#ccc"/>
  <rect x="145" y="224" width="3" height="8" fill="#ccc"/>
  
  <rect x="165" y="218" width="30" height="20" rx="3" fill="#3a3a3a" stroke="#555" stroke-width="1"/>
  <polygon points="175,224 187,224 187,234 175,234" fill="none" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- MONTHLY.LIVE text -->
  <text x="128" y="80" text-anchor="middle" fill="#64c8ff" font-family="Arial" font-size="10" font-weight="bold" opacity="0.8">MONTHLY.LIVE</text>
</svg>
