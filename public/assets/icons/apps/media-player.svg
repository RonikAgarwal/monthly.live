<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tileBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5d4ff"/>
      <stop offset="1" stop-color="#3f86d8"/>
    </linearGradient>
    <linearGradient id="tileFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9ff"/>
      <stop offset="0.4" stop-color="#7db6f5"/>
      <stop offset="1" stop-color="#3f8ae0"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="0.45" stop-color="#ff9d1c"/>
      <stop offset="1" stop-color="#e06a00"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Back tile (rotated) -->
  <g transform="rotate(-8 112 118)">
    <rect x="38" y="42" width="150" height="150" rx="20" fill="url(#tileBack)" opacity="0.9"/>
    <rect x="50" y="54" width="126" height="34" rx="12" fill="url(#shine)" opacity="0.35"/>
  </g>

  <!-- Front tile -->
  <g>
    <rect x="60" y="56" width="168" height="168" rx="22" fill="url(#tileFront)" stroke="rgba(255,255,255,0.75)" stroke-width="4"/>
    <rect x="74" y="70" width="140" height="40" rx="14" fill="url(#shine)" opacity="0.5"/>
    <!-- faint inner window bars -->
    <rect x="84" y="140" width="80" height="10" rx="5" fill="rgba(255,255,255,0.45)"/>
    <rect x="84" y="162" width="58" height="10" rx="5" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Orange play disc -->
  <circle cx="96" cy="152" r="58" fill="url(#disc)" stroke="rgba(255,255,255,0.85)" stroke-width="4"/>
  <ellipse cx="78" cy="128" rx="20" ry="11" fill="rgba(255,255,255,0.55)" transform="rotate(-24 78 128)"/>
  <!-- White play triangle -->
  <polygon points="76,130 76,174 112,152" fill="#fff"/>
</svg>
