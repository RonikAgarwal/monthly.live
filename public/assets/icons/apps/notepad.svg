<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="50%" style="stop-color:#3a7bc8"/>
      <stop offset="100%" style="stop-color:#2d6cb5"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a5a9e"/>
      <stop offset="100%" style="stop-color:#3a7bc8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Shadow base -->
  <rect x="40" y="30" width="180" height="210" rx="4" fill="rgba(0,0,0,0.15)"/>
  
  <!-- Back cover -->
  <rect x="38" y="26" width="180" height="210" rx="5" fill="url(#coverGrad)" filter="url(#shadow)"/>
  
  <!-- Pages -->
  <rect x="50" y="20" width="168" height="204" rx="2" fill="url(#pageGrad)"/>
  <rect x="56" y="18" width="168" height="204" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- Page lines -->
  <line x1="72" y1="60" x2="200" y2="60" stroke="#b8d4f0" stroke-width="1.5"/>
  <line x1="72" y1="80" x2="200" y2="80" stroke="#b8d4f0" stroke-width="1.5"/>
  <line x1="72" y1="100" x2="200" y2="100" stroke="#b8d4f0" stroke-width="1.5"/>
  <line x1="72" y1="120" x2="200" y2="120" stroke="#b8d4f0" stroke-width="1.5"/>
  <line x1="72" y1="140" x2="200" y2="140" stroke="#b8d4f0" stroke-width="1.5"/>
  <line x1="72" y1="160" x2="180" y2="160" stroke="#b8d4f0" stroke-width="1.5"/>
  
  <!-- Red margin line -->
  <line x1="68" y1="40" x2="68" y2="200" stroke="#e74c3c" stroke-width="1" opacity="0.6"/>
  
  <!-- Blue spiral binding -->
  <circle cx="65" cy="55" r="5" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="65" cy="90" r="5" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="65" cy="125" r="5" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="65" cy="160" r="5" fill="none" stroke="#555" stroke-width="2"/>
  
  <!-- Pen -->
  <g transform="translate(145, 35) rotate(30)">
    <rect x="0" y="0" width="8" height="60" fill="#f0c040"/>
    <rect x="0" y="0" width="8" height="15" fill="#e74c3c"/>
    <polygon points="0,60 4,72 8,60" fill="#c0a030"/>
    <rect x="1" y="55" width="6" height="8" fill="#333"/>
  </g>
  
  <!-- Glossy highlight -->
  <ellipse cx="120" cy="60" rx="60" ry="25" fill="white" opacity="0.15"/>
</svg>
